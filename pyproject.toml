[project]
name = "resnet-vit"
version = "0.1.0"
description = "ResNet and ViT trained from scratch on Tiny ImageNet: training-recipe ablations, multi-GPU, and TensorRT deployment.” A leftover template line is the first thing a reviewer notices."
readme = "README.md"
authors = [
    { name = "pouyasam1996", email = "samandi.pouya@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
# Target a specific Python version
# Set line length limits (Default is 88)
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Select specific rule sets (E = Pycodestyle, F = Pyflakes, I = Isort)
select = ["E", "F", "I", "B", "W", "SIM", "NPY", "UP", "RUF"]
# Ignore specific error codes
ignore = ["E501"]


